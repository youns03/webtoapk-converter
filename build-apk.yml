name: 🚀 Build Android APK

on:
  workflow_dispatch:
      inputs:
            url:
                    description: "🌐 Website URL or ZIP link"
                            required: true
                                  app_name:
                                          description: "📱 Application Name"
                                                  required: true
                                                          default: "WebToAPK"
                                                                package_name:
                                                                        description: "📦 Package Name (e.g., com.example.myapp)"
                                                                                required: true
                                                                                        default: "com.webtoapk"
                                                                                              icon_path:
                                                                                                      description: "🖼️ Icon Path (e.g., @mipmap/ic_launcher)"
                                                                                                              required: false
                                                                                                                    splash_screen_path:
                                                                                                                            description: "✨ Splash Screen Path"
                                                                                                                                    required: false
                                                                                                                                    
                                                                                                                                    jobs:
                                                                                                                                      build:
                                                                                                                                          name: 🛠️ Build APK Process
                                                                                                                                              runs-on: ubuntu-latest
                                                                                                                                                  concurrency:
                                                                                                                                                        group: build-apk
                                                                                                                                                              cancel-in-progress: false
                                                                                                                                                                  timeout-minutes: 15
                                                                                                                                                                  
                                                                                                                                                                      steps:
                                                                                                                                                                            - name: 📥 Checkout Repository
                                                                                                                                                                                    uses: actions/checkout@v4
                                                                                                                                                                                    
                                                                                                                                                                                     
